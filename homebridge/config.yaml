name: Homebridge
# renovate: datasource=docker depName=homebridge/homebridge
version: "2026-11-13"
slug: homebridge
image: homebridge/homebridge
description: Homebridge - HomeKit support for the impatient
arch:
  - aarch64
  - amd64
url: https://github.com/tomwilkie/home-assistant-addons/tree/main/homebridge
init: false
host_network: true
ports:
  8581/tcp: 8581
ports_description:
  8581/tcp: Homebridge UI
webui: http://[HOST]:[PORT:8581]
panel_icon: mdi:bridge
map:
  - type: app_config
    path: /homebridge
    read_only: false
backup_exclude:
  - node_modules
