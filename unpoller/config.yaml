---
name: UnPoller
# renovate: datasource=docker depName=ghcr.io/unpoller/unpoller
version: 5.8.3
slug: unpoller
description: |
  Collect your UniFi controller data and report it to an InfluxDB instance, or export it for Prometheus collection.
arch:
  - aarch64
  - amd64
startup: system
url: https://github.com/tomwilkie/home-assistant-addons/tree/main/unpoller
init: false
ports:
  9130/tcp: 9130
ports_description:
  9130/tcp: Unpoller Prometheus Endpoint
panel_icon: mdi:router-network
map:
  - type: homeassistant_config
    path: /config
options:
  log_level: info
  dynamic_configuration_path: "/config/addons/unpoller/up.conf"
  env_vars: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  dynamic_configuration_path: str?
  env_vars:
    - str
